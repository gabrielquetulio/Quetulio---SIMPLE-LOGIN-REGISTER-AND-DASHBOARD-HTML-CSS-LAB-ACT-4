<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="split-shell">

    <!-- Illustration panel -->
    <div class="illustration-panel">

      <svg class="deco-grid" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
        <circle cx="40" cy="60" r="2" fill="#fff"/>
        <circle cx="90" cy="60" r="2" fill="#fff"/>
        <circle cx="140" cy="60" r="2" fill="#fff"/>
        <circle cx="40" cy="110" r="2" fill="#fff"/>
        <circle cx="90" cy="110" r="2" fill="#fff"/>
        <circle cx="140" cy="110" r="2" fill="#fff"/>
        <circle cx="40" cy="160" r="2" fill="#fff"/>
        <circle cx="90" cy="160" r="2" fill="#fff"/>
        <circle cx="140" cy="160" r="2" fill="#fff"/>
        <circle cx="330" cy="560" r="2" fill="#fff"/>
        <circle cx="370" cy="560" r="2" fill="#fff"/>
        <circle cx="330" cy="600" r="2" fill="#fff"/>
        <circle cx="370" cy="600" r="2" fill="#fff"/>
        <circle cx="330" cy="640" r="2" fill="#fff"/>
        <circle cx="370" cy="640" r="2" fill="#fff"/>
      </svg>

      <!-- Person + plus mark: echoes "create an account" -->
      <svg class="mark" style="right:-50px; bottom:-30px; width:340px; height:340px; opacity:0.16;" viewBox="0 0 200 200">
        <circle cx="90" cy="70" r="34" fill="none" stroke="#fff" stroke-width="10"/>
        <path d="M40 175 C40 130 60 108 90 108 C120 108 140 130 140 175" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
        <line x1="160" y1="60" x2="160" y2="104" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
        <line x1="138" y1="82" x2="182" y2="82" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <svg class="mark" style="left:-30px; top:38%; width:120px; height:120px; opacity:0.14;" viewBox="0 0 200 200">
        <rect x="40" y="40" width="120" height="120" rx="24" fill="none" stroke="#fff" stroke-width="8" transform="rotate(20 100 100)"/>
      </svg>

      <div class="brand">
        <span class="logo-dot"></span>
        <span>MyApp</span>
      </div>

      <div class="headline">
        <h2>Create an account and get set up in seconds.</h2>
        <p>Join MyApp to save your progress and access your dashboard anytime.</p>
      </div>

    </div>

    <!-- Form panel -->
    <div class="form-panel">
      <div class="auth-wrapper">
        <div class="auth-card">

          <h1>Create an account</h1>
          <p class="subtitle">Fill in your details to get started.</p>

          <form>
            <div class="field">
              <label for="fullname">Full Name</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
              </div>
            </div>

            <div class="field">
              <label for="username">Username</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 8v6M19 11h6"/></svg>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="password">Password</label>
                <div class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
              </div>

              <div class="field">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
                </div>
              </div>
            </div>

            <!-- No backend yet, so "Register" is an anchor styled as a button,
                 per the activity requirement to redirect using <a> to login.html -->
            <a href="login.html" class="btn-primary">Register</a>
          </form>

          <p class="auth-footer">
            Already have an account? <a href="login.html">Login here</a>
          </p>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
