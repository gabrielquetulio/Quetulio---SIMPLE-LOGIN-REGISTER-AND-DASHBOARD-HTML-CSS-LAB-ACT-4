<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="split-shell">

    <!-- Illustration panel -->
    <div class="illustration-panel">

      <svg class="deco-grid" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
        <circle cx="40" cy="60" r="2" fill="#fff"/>
        <circle cx="90" cy="60" r="2" fill="#fff"/>
        <circle cx="140" cy="60" r="2" fill="#fff"/>
        <circle cx="40" cy="110" r="2" fill="#fff"/>
        <circle cx="90" cy="110" r="2" fill="#fff"/>
        <circle cx="140" cy="110" r="2" fill="#fff"/>
        <circle cx="40" cy="160" r="2" fill="#fff"/>
        <circle cx="90" cy="160" r="2" fill="#fff"/>
        <circle cx="140" cy="160" r="2" fill="#fff"/>
        <circle cx="330" cy="560" r="2" fill="#fff"/>
        <circle cx="370" cy="560" r="2" fill="#fff"/>
        <circle cx="330" cy="600" r="2" fill="#fff"/>
        <circle cx="370" cy="600" r="2" fill="#fff"/>
        <circle cx="330" cy="640" r="2" fill="#fff"/>
        <circle cx="370" cy="640" r="2" fill="#fff"/>
      </svg>

      <!-- Keyhole mark: circle + tapered base, echoes the login/security theme -->
      <svg class="mark" style="right:-60px; bottom:-40px; width:340px; height:340px; opacity:0.16;" viewBox="0 0 200 200">
        <circle cx="100" cy="80" r="45" fill="none" stroke="#fff" stroke-width="10"/>
        <path d="M85 118 L115 118 L128 190 L72 190 Z" fill="#fff"/>
      </svg>
      <svg class="mark" style="left:-30px; top:40%; width:120px; height:120px; opacity:0.14;" viewBox="0 0 200 200">
        <rect x="40" y="40" width="120" height="120" rx="24" fill="none" stroke="#fff" stroke-width="8" transform="rotate(20 100 100)"/>
      </svg>

      <div class="brand">
        <span class="logo-dot"></span>
        <span>MyApp</span>
      </div>

      <div class="headline">
        <h2>Sign in and pick up right where you left off.</h2>
        <p>Your account keeps your dashboard, settings, and activity in one place.</p>
      </div>

    </div>

    <!-- Form panel -->
    <div class="form-panel">
      <div class="auth-wrapper">
        <div class="auth-card">

          <h1>Welcome back</h1>
          <p class="subtitle">Log in to continue to your dashboard.</p>

          <form action="dashboard.html">
            <div class="field">
              <label for="username">Username</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
              </div>
            </div>

            <div class="form-options">
              <label><input type="checkbox" name="remember"> Remember me</label>
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary">Login</button>
          </form>

          <p class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
          </p>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
