<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-wrapper">

    <div class="dashboard-nav">
      <div class="brand">
        <span class="logo-dot"></span>
        <span>MyApp</span>
      </div>
      <a href="login.html" class="logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </a>
    </div>

    <div class="dashboard-hero">
      <svg class="deco" viewBox="0 0 780 200" preserveAspectRatio="xMidYMid slice">
        <circle cx="700" cy="30" r="90" fill="#fff" opacity="0.08"/>
        <circle cx="740" cy="160" r="50" fill="#fff" opacity="0.10"/>
        <circle cx="60" cy="180" r="3" fill="#fff"/>
        <circle cx="90" cy="180" r="3" fill="#fff"/>
        <circle cx="60" cy="150" r="3" fill="#fff"/>
        <circle cx="90" cy="150" r="3" fill="#fff"/>
      </svg>
      <div class="content">
        <div class="avatar">JD</div>
        <div>
          <h1>Welcome back, Juan 👋</h1>
          <p>Here's a quick overview of your account.</p>
        </div>
      </div>
    </div>

    <div class="dashboard-card">
      <h3>Account overview</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <div class="value">1</div>
            <div class="label">Account created</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div>
            <div class="value">Active</div>
            <div class="label">Account status</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <div class="value">Today</div>
            <div class="label">Last login</div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
